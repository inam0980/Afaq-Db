# Production stack: PostgreSQL + Django/Gunicorn + Nginx. See docs/INSTALL.md.
#   docker compose up -d --build
# Settings come from .env (copy .env.example). Data lives in named volumes,
# so rebuilding or upgrading containers never loses it.

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      PG_BIN_DIR: ""
      BACKUP_DIR: /app/backups_data
      MEDIA_ROOT: /app/media
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    volumes:
      - media:/app/media
      - backups:/app/backups_data
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - static:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  pgdata:
  media:
  backups:
  static:
