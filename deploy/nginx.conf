# Nginx in front of Gunicorn (mounted as /etc/nginx/conf.d/default.conf).
# Static files are served directly. Uploaded files (receipts, iqama scans,
# leave documents) are deliberately NOT served here: they are only
# downloadable through Django views that check permissions.
#
# HTTPS: copy fullchain.pem + privkey.pem into deploy/certs/, uncomment the
# 443 server and the redirect below, then set HTTPS=True in .env.

server {
    listen 80;
    server_name _;

    # return 301 https://$host$request_uri;      # <- enable together with the 443 server

    client_max_body_size 10m;                    # receipts are limited to 5 MB in the app

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}

